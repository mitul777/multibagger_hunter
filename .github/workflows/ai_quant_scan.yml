name: AI Quant Scan (Parallelized)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 6' # Saturdays at 4 AM

jobs:
  gather-data:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk:
          - { start: 0, end: 500 }
          - { start: 500, end: 1000 }
          - { start: 1000, end: 1500 }
          - { start: 1500, end: 2000 }
          - { start: 2000, end: 2500 }
    
    timeout-minutes: 60
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gather Market Data for Chunk
        run: python hunter_factor_model.py --gather --start ${{ matrix.chunk.start }} --end ${{ matrix.chunk.end }}

      - name: Upload Chunk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-data-chunk-${{ matrix.chunk.start }}
          path: output/raw_data_*.csv
          retention-days: 1

  analyze-and-enrich:
    needs: gather-data
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download all Chunk Artifacts
        uses: actions/download-artifact@v4
        with:
          path: output_temp
          pattern: raw-data-chunk-*
          merge-multiple: true

      - name: Move CSVs to output directory
        run: |
          mkdir -p output
          mv output_temp/*.csv output/ || true

      - name: Run Factor Scoring (Z-Scores)
        run: python hunter_factor_model.py --score

      - name: Run ML Clustering (Anomaly Detection)
        run: python hunter_ml_cluster.py --score

      - name: Run FinBERT AI Deep Dive on Factor Top 50
        run: python ai_enricher.py --input output/factor_model_candidates.xlsx --limit 50

      - name: Run FinBERT AI Deep Dive on ML Cluster Top 50
        run: python ai_enricher.py --input output/ml_cluster_candidates.xlsx --limit 50

      - name: Upload Final Factor Candidates
        uses: actions/upload-artifact@v4
        with:
          name: factor-model-candidates
          path: output/factor_model_candidates.xlsx
          retention-days: 7

      - name: Upload Final ML Cluster Candidates
        uses: actions/upload-artifact@v4
        with:
          name: ml-cluster-candidates
          path: output/ml_cluster_candidates.xlsx
          retention-days: 7
